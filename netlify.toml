# Netlify configuration (free plan). Netlify reads this automatically.
# Netlify runs this on every push to the production branch: it installs the
# packages in package-lock.json, builds the site into _site, then runs the
# site check. If the check finds a broken link or missing alt text, the
# build fails and the previous version of the site stays live.
[build]
  command = "npm run netlify"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Long cache for fingerprint-free but rarely changing static assets
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------- Redirects (v2 navigation, 26 Nov 2026) ----------
# Guides merged into the Press-On Hub; Holiday Home renamed Home & Decor.
[[redirects]]
